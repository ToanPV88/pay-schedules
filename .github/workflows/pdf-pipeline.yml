# Pipeline PDF (PLAN Công đoạn 5, DECISIONS.md D-019): một lô học khu chưa có bảng lương.
# Discover → Fetch → Classify → đọc bảng (tất định, 2 bộ đọc độc lập, D-022) → Validate → nạp D1.
# - Chạy tay (workflow_dispatch), hoặc đẩy commit lên `run/pdf-pipeline-preview` /
#   `run/pdf-pipeline-production`: khi đó tham số lấy từ `pipeline/pdf-pipeline-run.json`.
#   target=production chỉ chạy từ commit đã có trên `main`.
# - Không gọi API trả phí nào. CLOUDFLARE_API_TOKEN chỉ ở bước gọi wrangler.
# - Tài liệu tải về và báo cáo lưu vào Release `docs-<target>-<ngày>-<run>`; job `archive` chỉ có
#   quyền ghi Release, không ra Internet, không dùng secret.
# - Điểm lưu: bảng `district_pipeline` trong D1; lô sau bỏ qua học khu đã xử lý đến hạn chạy lại.
name: PDF pipeline

on:
  workflow_dispatch:
    inputs:
      target:
        description: "CSDL đích"
        type: choice
        options: [preview, production]
        default: preview
      limit:
        description: "Số học khu trong lô (đông học sinh trước)"
        default: "100"
      rerun:
        description: "Chạy lại cả học khu có trạng thái này (vd. no_schedule,no_candidates), để trống = không"
        default: ""
      state:
        description: "Chỉ một bang (mã 2 chữ), để trống = mọi bang"
        default: ""
  push:
    branches: ["run/pdf-pipeline-preview", "run/pdf-pipeline-production"]

permissions:
  contents: read

concurrency:
  group: pdf-pipeline
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TARGET: ${{ inputs.target || (github.ref_name == 'run/pdf-pipeline-production' && 'production' || 'preview') }}
  LIMIT: ${{ inputs.limit }}
  RERUN: ${{ inputs.rerun }}
  ONLY_STATE: ${{ inputs.state }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.key.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check inputs
        id: key
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            cfg=pipeline/pdf-pipeline-run.json
            LIMIT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["limit"])' "$cfg")
            RERUN=$(python3 -c 'import json,sys; print(",".join(json.load(open(sys.argv[1])).get("rerun", [])))' "$cfg")
            ONLY_STATE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("state", ""))' "$cfg")
            { echo "LIMIT=$LIMIT"; echo "RERUN=$RERUN"; echo "ONLY_STATE=$ONLY_STATE"; } >> "$GITHUB_ENV"
          fi
          [[ "$TARGET" =~ ^(preview|production)$ ]] || { echo "::error::target sai"; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]{1,4}$ ]] || { echo "::error::limit phải là số"; exit 1; }
          [[ -z "$RERUN" || "$RERUN" =~ ^[a-z_]+(,[a-z_]+)*$ ]] || { echo "::error::rerun sai"; exit 1; }
          [[ -z "$ONLY_STATE" || "$ONLY_STATE" =~ ^[A-Z]{2}$ ]] || { echo "::error::state sai"; exit 1; }
          if [ "$TARGET" = production ]; then
            git fetch --quiet origin main
            git merge-base --is-ancestor HEAD origin/main || { echo "::error::production chỉ từ main"; exit 1; }
          fi
          tag="docs-${TARGET}-$(date -u +%Y%m%d)-${RUN_ID}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          npm ci --no-audit --no-fund
          (cd pipeline && uv sync --locked --no-dev)
      - name: Read queue from D1
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$TARGET" = production ]; then db=pay-schedules; flag=""; else db=pay-schedules-preview; flag="--env preview"; fi
          filter=""
          if [ -n "$ONLY_STATE" ]; then filter="AND d.state = '$ONLY_STATE'"; fi
          rerun="'-'"
          if [ -n "$RERUN" ]; then rerun="'${RERUN//,/\',\'}'"; fi
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npx wrangler d1 execute "$db" $flag --remote --json --command \
            "SELECT d.id AS district_id, d.nces_id, d.name, d.state, d.website, d.enrollment FROM districts d LEFT JOIN district_pipeline p ON p.district_id = d.id WHERE d.active = 1 AND d.employer_type = 'school_district' $filter AND (p.district_id IS NULL OR p.status IN ($rerun) OR (p.next_run_at IS NOT NULL AND p.next_run_at <= '$now')) AND NOT EXISTS (SELECT 1 FROM schedules s WHERE s.district_id = d.id AND s.status IN ('published', 'draft')) ORDER BY d.enrollment IS NULL, d.enrollment DESC LIMIT $LIMIT" \
            > "$GITHUB_WORKSPACE/queue.json"
          npx wrangler d1 execute "$db" $flag --remote --json --command \
            "SELECT DISTINCT d.url, d.sha256 FROM source_documents d JOIN extraction_runs e ON e.source_document_id = d.id WHERE d.district_id IS NOT NULL" \
            > "$GITHUB_WORKSPACE/known.json"
          npx wrangler d1 execute "$db" $flag --remote --json --command \
            "SELECT nces_id, state, name, active FROM districts WHERE nces_id IS NOT NULL" \
            > "$GITHUB_WORKSPACE/catalog.json"
          npx wrangler d1 execute "$db" $flag --remote --json --command \
            "SELECT d.nces_id, s.school_year, s.schedule_type, s.title, (SELECT c.amount_cents FROM cells c JOIN steps t ON t.id = c.step_id LEFT JOIN lanes l ON l.id = c.lane_id WHERE c.schedule_id = s.id AND t.position = 1 AND c.amount_cents IS NOT NULL ORDER BY l.position LIMIT 1) AS start_cents FROM schedules s JOIN districts d ON d.id = s.district_id WHERE s.status = 'published' AND s.schedule_type = 'teacher'" \
            > "$GITHUB_WORKSPACE/published.json"
      - name: Discover, fetch, classify
        working-directory: pipeline
        run: |
          uv run pay-pipeline pdf-gather --queue "$GITHUB_WORKSPACE/queue.json" \
            --known "$GITHUB_WORKSPACE/known.json" --out "$GITHUB_WORKSPACE/work" --deadline-minutes 45
      - name: Read schedules
        working-directory: pipeline
        run: uv run pay-pipeline pdf-extract --work "$GITHUB_WORKSPACE/work"
      - name: Validate and build SQL
        working-directory: pipeline
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          uv run pay-pipeline pdf-build --work "$GITHUB_WORKSPACE/work" \
            --catalog "$GITHUB_WORKSPACE/catalog.json" --published "$GITHUB_WORKSPACE/published.json" \
            --release-tag "$TAG" --run-key "$TAG" \
            --sql "$GITHUB_WORKSPACE/work/pipeline.sql" --report "$GITHUB_WORKSPACE/work/report.md"
          cat "$GITHUB_WORKSPACE/work/report.md" >> "$GITHUB_STEP_SUMMARY"
          cp "$GITHUB_WORKSPACE/work/report.md" "$GITHUB_WORKSPACE/work/work.json" "$GITHUB_WORKSPACE/work/docs/"
          if [ -f "$GITHUB_WORKSPACE/work/extractions.json" ]; then cp "$GITHUB_WORKSPACE/work/extractions.json" "$GITHUB_WORKSPACE/work/docs/"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: work
          path: |
            work/docs/
            work/pipeline.sql
          retention-days: 7
          if-no-files-found: error

  archive:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: work
          path: work
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.run.outputs.tag }}
        run: |
          gh release create "$TAG" work/docs/* --repo "$REPO" --title "$TAG" \
            --notes "Tài liệu học khu và báo cáo của pipeline PDF (${TARGET})." --prerelease
          echo "Release: $TAG" >> "$GITHUB_STEP_SUMMARY"

  load:
    needs: [run, archive]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: work
          path: work
      - name: Load into D1
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$TARGET" = production ]; then db=pay-schedules; flag=""; else db=pay-schedules-preview; flag="--env preview"; fi
          npx wrangler d1 execute "$db" $flag --remote --file "$GITHUB_WORKSPACE/work/pipeline.sql"
          npx wrangler d1 execute "$db" $flag --remote --json --command \
            "SELECT status, COUNT(*) AS districts FROM district_pipeline GROUP BY status ORDER BY 2 DESC" \
            > "$GITHUB_WORKSPACE/after.json"
          { echo '## Sau khi nạp'; echo '```json'; cat "$GITHUB_WORKSPACE/after.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
