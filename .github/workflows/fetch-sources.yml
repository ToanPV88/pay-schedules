# Tải tệp nguồn công khai đã kê khai trong pipeline/sources/*.json, rồi lưu vào GitHub Release
# riêng tư của repo (DECISIONS.md D-011, D-014).
# - Job `fetch` là job duy nhất ra Internet; chỉ có quyền đọc repo.
# - Job `archive` chỉ có quyền ghi nội dung repo để tạo Release; không ra Internet ngoài GitHub,
#   không dùng secret nào. Release đã có thì không ghi đè: mỗi lần chạy là một tag mới.
name: Fetch sources

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Tệp kê khai nguồn"
        default: pipeline/sources/oh-serb-contracts.json
  push:
    branches: ["run/fetch-sources"]

permissions:
  contents: read

concurrency:
  group: fetch-sources
  cancel-in-progress: false

env:
  MANIFEST: ${{ inputs.manifest || 'pipeline/sources/oh-serb-contracts.json' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Fetch declared files
        working-directory: pipeline
        run: |
          uv sync --locked --no-dev
          uv run pay-pipeline fetch-sources "../$MANIFEST" --out ../dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sources
          path: dist/
          retention-days: 3
          if-no-files-found: error

  archive:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sources
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          prefix=$(python3 -c 'import json; print(json.load(open("dist/manifest.json"))["release_prefix"])')
          tag="${prefix}-$(date -u +%Y%m%d)-${RUN_ID}"
          {
            echo "Tệp nguồn tải bởi workflow Fetch sources, lần chạy ${RUN_ID}."
            echo
            echo '```json'
            cat dist/manifest.json
            echo '```'
          } > notes.md
          gh release create "$tag" dist/* --repo "$REPO" --title "$tag" --notes-file notes.md
          echo "Release: $tag" >> "$GITHUB_STEP_SUMMARY"
