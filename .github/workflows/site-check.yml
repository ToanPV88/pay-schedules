# Tạm: tra tên miền còn trống qua RDAP (không secret, chỉ đọc).
name: Site check
on:
  push:
    branches: ["run/site-check"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: RDAP
        run: |
          names="paygrids paygrid publicpaygrid salarygrid salarygrids paytables publicpaytables payschedules payscheduledb publicpayscales stepandlane stepsandlanes salarysteps payladder publicpayladder openpaygrid salaryschedules salaryscheduledb payscaledb paystepper wagegrid publicwagegrid salarytable salarytables scheduleofpay paysteps publicpaysteps stepscale salaryladder paygridhq"
          for n in $names; do
            for tld in com org; do
              if [ "$tld" = com ]; then u="https://rdap.verisign.com/com/v1/domain/$n.com"; else u="https://rdap.publicinterestregistry.org/rdap/domain/$n.org"; fi
              code=$(curl -s -o r.json -w '%{http_code}' "$u")
              if [ "$code" = 404 ]; then echo "FREE  $n.$tld"
              elif [ "$code" = 200 ]; then echo "TAKEN $n.$tld $(jq -r '[.events[]?|select(.eventAction=="registration")|.eventDate][0] // ""' r.json | cut -c1-10)"
              else echo "?$code $n.$tld"; fi
              sleep 0.3
            done
          done
