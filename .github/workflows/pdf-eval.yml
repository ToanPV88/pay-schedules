# Bộ chuẩn của pipeline PDF (PLAN Công đoạn 5, nghiệm thu; DECISIONS.md D-020).
# Chạy classify → extract (Claude, 2 lần) → validate trên mọi tài liệu trong pipeline/gold/*.json,
# so từng ô với bảng nhập tay. Không ghi D1. Báo cáo lưu ở Release `report-gold-<ngày>-<run>`.
# Chạy: đẩy commit lên nhánh `run/pdf-eval`, hoặc chạy tay.
name: PDF eval

on:
  workflow_dispatch:
  push:
    branches: ["run/pdf-eval"]

permissions:
  contents: read

concurrency:
  group: pdf-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          (cd pipeline && uv sync --locked --no-dev)
      - name: Download gold documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gold-docs
          python3 - <<'PY' > gold-assets.txt
          import json, pathlib
          for p in sorted(pathlib.Path("pipeline/gold").glob("*.json")):
              d = json.loads(p.read_text())["document"]
              print(d["release"], d["asset"], d["sha256"])
          PY
          sort -u gold-assets.txt | while read -r release asset sha; do
            [ -f "gold-docs/$asset" ] || gh release download "$release" --pattern "$asset" --dir gold-docs
            echo "$sha  gold-docs/$asset" | sha256sum -c --quiet
          done
      - name: Evaluate
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run pay-pipeline pdf-eval --gold gold --docs "$GITHUB_WORKSPACE/gold-docs" \
            --report "$GITHUB_WORKSPACE/out/gold-report.md"
      - name: Summary
        if: always()
        run: |
          if [ -f out/gold-report.md ]; then cat out/gold-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report
          path: out/
          retention-days: 7

  publish-report:
    needs: eval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report
          path: out
      - name: Create report release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          tag="report-gold-$(date -u +%Y%m%d)-${RUN_ID}"
          gh release create "$tag" out/* --repo "$REPO" --title "$tag" --notes "Kết quả bộ chuẩn pipeline PDF." --prerelease
