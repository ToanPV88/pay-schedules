# Nạp bảng lương liên bang (OPM General Schedule + 58 vùng, y tá VA) vào D1 (DECISIONS.md D-065).
# - Tệp nguồn: Release mới nhất `src-federal-pay-2026-*`, tạo bằng fetch-sources.yml với
#   manifest=pipeline/sources/federal-pay-2026.json; kiểm SHA-256 trước khi đọc.
# - Đẩy commit lên run/import-federal-preview hoặc run/import-federal-production (production chỉ
#   chạy từ commit đã merge vào main). Mỗi (loại bảng, năm) được thay toàn bộ; bảng có lỗi bị giữ
#   lại và ghi trong báo cáo.
name: Import federal

on:
  workflow_dispatch:
    inputs:
      target:
        description: "CSDL đích"
        type: choice
        options: [preview, production]
        default: preview
  push:
    branches: ["run/import-federal-preview", "run/import-federal-production"]

permissions:
  contents: read

concurrency:
  group: import-federal
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  MANIFEST: pipeline/sources/federal-pay-2026.json
  TARGET: ${{ inputs.target || (github.ref_name == 'run/import-federal-production' && 'production' || 'preview') }}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Production only from main
        if: env.TARGET == 'production'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Nạp production chỉ được chạy từ commit đã merge vào main."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          (cd pipeline && uv sync --locked --no-dev)
      - name: Download and verify sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_prefix"])' "$MANIFEST")
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$prefix-" --jq '[.[].ref | sub("refs/tags/"; "")] | sort | last // ""')
          if [ -z "$tag" ]; then echo "::error::Chưa có Release $prefix-* (chạy fetch-sources.yml với manifest=$MANIFEST)"; exit 1; fi
          gh release download "$tag" --dir sources
          (cd pipeline && uv run pay-pipeline verify-sources "$GITHUB_WORKSPACE/sources")
          echo "SOURCE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Build
        working-directory: pipeline
        run: |
          uv run pay-pipeline federal-build --sources "$GITHUB_WORKSPACE/sources" \
            --release-tag "$SOURCE_TAG" --sql "$GITHUB_WORKSPACE/federal.sql" \
            --report "$GITHUB_WORKSPACE/report.md"
      - name: Load into D1
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$TARGET" = production ]; then db=pay-schedules; flag=""; else db=pay-schedules-preview; flag="--env preview"; fi
          npx wrangler d1 execute "$db" $flag --remote --file "$GITHUB_WORKSPACE/federal.sql"
          npx wrangler d1 execute "$db" $flag --remote --json --command \
            "SELECT family, year, COUNT(*) AS tables, (SELECT COUNT(*) FROM pay_cells c JOIN pay_tables t2 ON t2.id = c.table_id WHERE t2.family = t.family AND t2.year = t.year) AS cells FROM pay_tables t GROUP BY family, year ORDER BY family, year" \
            > "$GITHUB_WORKSPACE/after.json"
      - name: Report
        run: |
          {
            echo
            echo "## Sau khi nạp vào D1 ($TARGET, nguồn $SOURCE_TAG)"
            echo
            echo '```json'
            cat after.json
            echo '```'
          } >> report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          mkdir out && cp report.md after.json out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: out/
          retention-days: 7

  publish-report:
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report
          path: out
      - name: Create report release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          tag="report-federal-${TARGET}-$(date -u +%Y%m%d)-${RUN_ID}"
          gh release create "$tag" out/* --repo "$REPO" --title "$tag" --notes "Báo cáo nạp bảng lương liên bang (${TARGET})." --prerelease
