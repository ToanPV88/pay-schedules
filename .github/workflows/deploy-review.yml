# Deploy trang xem tay nội bộ apps/review (DECISIONS.md D-021).
# - Pull request đụng apps/review: deploy Worker pay-schedules-review-preview (CSDL preview).
# - Merge vào main: deploy Worker pay-schedules-review (CSDL production).
# Migration do deploy.yml áp. Mật khẩu lấy từ GitHub secret REVIEW_PASSWORD và đặt bằng
# `wrangler secret put` (đọc từ stdin, không in ra log); thiếu secret thì Worker từ chối mọi yêu cầu.
# Bản production còn nhận secret PURGE_TOKEN (cùng giá trị với Worker web) để xóa cache website sau
# khi publish (D-023); bản preview không xóa cache nên không cần.
name: Deploy review

on:
  pull_request:
    paths: ["apps/review/**", ".github/workflows/deploy-review.yml"]
  push:
    branches: [main]
    paths: ["apps/review/**", ".github/workflows/deploy-review.yml"]

permissions:
  contents: read

concurrency:
  group: deploy-review-${{ github.event_name }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then flag=""; else flag="--env preview"; fi
          npx wrangler deploy $flag | tee deploy.log
          grep -oE "https://pay-schedules-review[a-z-]*\.[a-z0-9.-]+\.workers\.dev" deploy.log | head -1 >> "$GITHUB_STEP_SUMMARY" || true
      - name: Set password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REVIEW_PASSWORD: ${{ secrets.REVIEW_PASSWORD }}
        run: |
          if [ -z "$REVIEW_PASSWORD" ]; then
            echo "::warning::Chưa có secret REVIEW_PASSWORD: trang xem tay sẽ từ chối mọi yêu cầu."
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then flag=""; else flag="--env preview"; fi
          printf '%s' "$REVIEW_PASSWORD" | npx wrangler secret put REVIEW_PASSWORD $flag
      - name: Set cache purge token
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
        run: |
          if [ -z "$PURGE_TOKEN" ]; then
            echo "::warning::Chưa có secret PURGE_TOKEN: cache website không được xóa sau khi publish."
            exit 0
          fi
          printf '%s' "$PURGE_TOKEN" | npx wrangler secret put PURGE_TOKEN
