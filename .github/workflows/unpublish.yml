# Gỡ khỏi website các bảng đọc từ tài liệu dùng chung nhiều học khu (DECISIONS.md D-066).
# Đẩy commit có tệp danh sách URL (biến URLS bên dưới) lên run/unpublish-preview hoặc
# run/unpublish-production (production chỉ chạy từ commit đã merge vào main).
name: Unpublish

on:
  push:
    branches: ["run/unpublish-preview", "run/unpublish-production"]

permissions:
  contents: read

concurrency:
  group: unpublish
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  # Each list is applied only when set; leave the ones already applied empty.
  URLS: ""
  REJECT_IDS: ""
  REQUEUE_IDS: ""
  # Districts to read again with the current reader even if they have a published table (D-069).
  DUE_IDS: pipeline/sources/rerun-columns-20261116.csv
  REQUEUE_REASON: "[lane_label] Cột không có tên trong tài liệu (Column N): xem tài liệu gốc trước khi duyệt (D-067)"
  REJECT_REASON: "Loại khi rà hàng chờ 2026-11-16: bảng đọc sai hoặc không phải bảng hiện hành"
  REASON: "Gỡ: bảng đọc từ tài liệu tổng hợp nhiều học khu, không phải bảng của học khu (D-066)"
  TARGET: ${{ github.ref_name == 'run/unpublish-production' && 'production' || 'preview' }}

jobs:
  unpublish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Production only from main
        if: env.TARGET == 'production'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Chỉ chạy production từ commit đã merge vào main."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          (cd pipeline && uv sync --locked --no-dev)
      - name: Build SQL
        if: env.URLS != ''
        working-directory: pipeline
        run: uv run pay-pipeline unpublish-docs --urls "../$URLS" --reason "$REASON" --sql "$GITHUB_WORKSPACE/unpublish.sql"
      - name: Build reject SQL
        if: env.REJECT_IDS != ''
        working-directory: pipeline
        run: uv run pay-pipeline reject-schedules --ids "../$REJECT_IDS" --reason "$REJECT_REASON" --sql "$GITHUB_WORKSPACE/reject.sql"
      - name: Build requeue SQL
        if: env.REQUEUE_IDS != ''
        working-directory: pipeline
        run: uv run pay-pipeline reject-schedules --requeue --ids "../$REQUEUE_IDS" --reason "$REQUEUE_REASON" --sql "$GITHUB_WORKSPACE/requeue.sql"
      - name: Build due SQL
        if: env.DUE_IDS != ''
        working-directory: pipeline
        run: uv run pay-pipeline due-districts --ids-file "../$DUE_IDS" --sql "$GITHUB_WORKSPACE/due.sql"
      - name: Apply to D1
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$TARGET" = production ]; then db=pay-schedules; flag=""; else db=pay-schedules-preview; flag="--env preview"; fi
          for f in unpublish reject requeue due; do
            if [ -s "$GITHUB_WORKSPACE/$f.sql" ]; then
              echo "== $f.sql"
              npx wrangler d1 execute "$db" $flag --remote --file "$GITHUB_WORKSPACE/$f.sql"
            fi
          done
          npx wrangler d1 execute "$db" $flag --remote --json --command \
            "SELECT COUNT(DISTINCT schedule_id) AS open_review FROM review_queue WHERE resolved_at IS NULL"
          npx wrangler d1 execute "$db" $flag --remote --json --command \
            "SELECT COUNT(*) AS due FROM district_pipeline WHERE next_run_at IS NOT NULL AND next_run_at <= strftime('%Y-%m-%dT%H:%M:%SZ', 'now')"
