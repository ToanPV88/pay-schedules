[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pay-pipeline"
version = "0.1.0"
description = "Pipeline: discover, fetch, classify, extract, validate and publish public salary schedules."
requires-python = ">=3.12"
license = { text = "Proprietary" }
# Phụ thuộc runtime thêm theo từng công đoạn; mỗi phụ thuộc mới ghi lý do trong docs/DECISIONS.md.
dependencies = [
  "httpx>=0.27,<1",  # D-014: bộ tải lịch sự chép từ travienphi
  "openpyxl>=3.1,<4",  # D-016: đọc tệp Excel bảng lương của Kentucky
  # D-019: cắt trang PDF gửi model
  "pdfplumber>=0.11,<0.12",
]

[project.scripts]
pay-pipeline = "pay_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pyyaml>=6", "types-PyYAML", "types-openpyxl"]

[tool.hatch.build.targets.wheel]
packages = ["src/pay_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: kiểm thử cần mạng (không chạy trong CI)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cho phép ký tự tiếng Việt trong chuỗi và chú thích

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# SQL chỉ ghép từ hằng số và quote(); không có dữ liệu ngoài đi thẳng vào câu lệnh.
"src/pay_pipeline/schedules/d1sql.py" = ["S608"]
"src/pay_pipeline/pdf_pipeline/run.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pay_pipeline"]
