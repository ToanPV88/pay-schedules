[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pay-pipeline"
version = "0.1.0"
description = "Pipeline: discover, fetch, classify, extract, validate and publish public salary schedules."
requires-python = ">=3.12"
license = { text = "Proprietary" }
# Phụ thuộc runtime thêm theo từng công đoạn; mỗi phụ thuộc mới ghi lý do trong docs/DECISIONS.md.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pyyaml>=6", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/pay_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: kiểm thử cần mạng (không chạy trong CI)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cho phép ký tự tiếng Việt trong chuỗi và chú thích

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pay_pipeline"]
